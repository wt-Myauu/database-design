spring:
  application:
    name: data-base-design
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-secret-key-please-change-me-32bytes+}
    expire-seconds: ${APP_JWT_EXPIRE_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
